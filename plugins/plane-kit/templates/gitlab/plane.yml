# plane-kit: v{{pluginVersion}}
# ═════════════════════════ PLANE (gắn MR/commit vào work item) ═════════════════════════
# Mở/cập nhật MR, merge vào {{devBranch}}, đẩy tag vX.Y.Z → gắn link MR và comment vào work item có mã
# {{identifier}}-<số> trong nhánh/commit/MR; merge vào {{devBranch}} còn chuyển item chính của MR sang
# {{readyState}} (.plane-kit/plane_sync.py). Đây là job duy nhất nên chạy trên pipeline MR: các job
# build/deploy thường lọc theo CI_COMMIT_BRANCH/CI_COMMIT_TAG, hai biến này trống ở pipeline MR.
# `needs: []` để không chờ và không chặn build; script luôn thoát 0, allow_failure phòng runner lỗi.
# Repo tự thêm `stage:` và `tags:` của runner nếu cần.
plane-sync:
  image: python:3.12-alpine
  needs: []
  timeout: 5m
  allow_failure: true
  variables:
    GIT_DEPTH: "0" # đọc dải commit vừa merge và commit từ tag trước
    PLANE_IDENTIFIER: "{{identifier}}"
    PLANE_BASE_URL: "{{baseUrl}}"
    PLANE_WORKSPACE_SLUG: "{{workspaceSlug}}"
    PLANE_READY_STATE: "{{readyState}}"
    PLANE_MOVABLE_STATES: "{{movableStates}}"
    PLANE_DEV_BRANCH: "{{devBranch}}"
  before_script:
    - apk add --no-cache git
  script:
    - python3 .plane-kit/plane_sync.py
  rules:
    - if: '$PLANE_API_KEY == null || $PLANE_API_KEY == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "{{devBranch}}"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
